name: internradar

x-postgres: &postgres
  image: postgres:17.11-trixie@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
  restart: unless-stopped
  healthcheck:
    test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 10s
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  postgres:
    <<: *postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no .env}
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [development]

  postgres-test:
    <<: *postgres
    profiles: [test]
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER:?Defina POSTGRES_TEST_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Defina POSTGRES_TEST_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_TEST_DB:?Defina POSTGRES_TEST_DB no .env}
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
    ports:
      - '127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks: [testing]

volumes:
  postgres_data:
  postgres_test_data:

networks:
  development:
  testing:
